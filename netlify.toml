[build]
  command = "echo Netlify static frontend deploy"
  publish = "public"

[[redirects]]
  from = "/api/*"
  to = "https://web-production-70923.up.railway.app/api/:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
